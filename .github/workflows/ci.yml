name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pinero_test
          POSTGRES_USER: pinero
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pinero -d pinero_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://pinero:ci-only@localhost:5432/pinero_test
      TEST_DATABASE_URL: postgresql+psycopg://pinero:ci-only@localhost:5432/pinero_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Migrations round-trip and model drift
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Tests (unit + PostgreSQL integration)
        run: python -m pytest
      - name: OpenAPI contract is committed
        run: |
          python -m app.cli export-openapi ../../packages/types/openapi.json
          git diff --exit-code -- ../../packages/types/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.gen.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target prod -t pinero-api:ci services/api
      - run: docker build --target prod -t pinero-web:ci apps/web

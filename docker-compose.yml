# Local development stack. Ports bind to 127.0.0.1 only.
# The browser talks only to the web app; /api/v1 is proxied to the API service.
services:
  postgres:
    # PostgreSQL 17 with the pgvector extension available for Phase 3 retrieval.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pinero
      POSTGRES_USER: pinero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinero -d pinero"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./services/api
      target: dev
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips='*'"
    environment:
      APP_ENV: development
      LOG_FORMAT: console
      DATABASE_URL: postgresql+psycopg://pinero:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/pinero
      TEST_DATABASE_URL: postgresql+psycopg://pinero:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/pinero_test
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERTS_EMAIL_FROM: ${ALERTS_EMAIL_FROM:-Pinero alerts <onboarding@resend.dev>}
    ports:
      # Direct access for /docs and /metrics; the browser app does not use it.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs: filings, news, and alert evaluation (Phase 4). Same image as the API.
  worker:
    build:
      context: ./services/api
      target: dev
    command: python -m app.worker
    environment:
      APP_ENV: development
      LOG_FORMAT: console
      DATABASE_URL: postgresql+psycopg://pinero:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/pinero
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERTS_EMAIL_FROM: ${ALERTS_EMAIL_FROM:-Pinero alerts <onboarding@resend.dev>}
    volumes:
      - ./services/api:/app
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres-data:

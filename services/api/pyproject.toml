[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinero-api"
version = "0.2.0"
description = "Pinero financial research API (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "authlib>=1.4,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  # Local ONNX embeddings for filing search (no API key; ~200 MB with onnxruntime).
  "fastembed>=0.5,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "lxml>=5.3,<7",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "sentry-sdk>=2.19,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL (TEST_DATABASE_URL)"]
filterwarnings = [
  # Starlette and Authlib now recommend the httpx2 fork; httpx remains supported.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The httpx module is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# RUF001-003: formulas shown to users intentionally use typographic signs.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Raw EDGAR documents (HTML, XML) are kept verbatim; wrapping them would change the input.
"tests/fixtures_*.py" = ["E501"]
"app/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["authlib.*", "fastembed.*", "lxml.*", "pgvector.*"]
ignore_missing_imports = true
